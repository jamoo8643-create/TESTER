name: Build Cardputer PiCam Remote

on:
  push:
    paths:
      - "cardputer-picam/**"
      - ".github/workflows/cardputer-picam.yml"
  pull_request:
    paths:
      - "cardputer-picam/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('cardputer-picam/firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d cardputer-picam/firmware
      - run: cp cardputer-picam/firmware/.pio/build/cardputer/firmware.bin PiCamRemote.bin
      - uses: actions/upload-artifact@v4
        with:
          name: PiCamRemote
          path: PiCamRemote.bin
      # Also publish the .bin to a "<branch>-bin" branch so it can be fetched
      # with plain git (handy where artifact downloads are blocked).
      - name: Publish .bin to a branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir out && cp PiCamRemote.bin out/ && cd out
          sha256sum PiCamRemote.bin > PiCamRemote.bin.sha256
          git init -q -b bin && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "PiCamRemote.bin from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" bin:refs/heads/${GITHUB_REF_NAME}-bin
