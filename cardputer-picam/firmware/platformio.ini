; PiCam Remote for M5Stack Cardputer / Cardputer ADV
; Build:  pio run            -> .pio/build/cardputer/firmware.bin
; Install: copy firmware.bin to the SD card (e.g. /apps/PiCamRemote.bin)
;          and install it from M5Launcher like any other app.

[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    m5stack/M5Unified@^0.2.5
    bblanchon/ArduinoJson@^7.2.0
